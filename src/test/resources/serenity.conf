serenity {
  project.name = "TransUnion API Automation Framework"
  test.root = "features"
  requirements.dir = "src/test/resources/features"
  outputDirectory = "target/site/serenity"
  logging = VERBOSE
  reports.show.step.details = true
  tag.types = "api, capability, feature, issue"
  issue.tracker.url = "https://automationexercise.com/api_list#collapse{0}"
}

environments {
  default {
    restapi.baseurl = "https://automationexercise.com"
  }
  automationexercise {
    restapi.baseurl = "https://automationexercise.com"
  }
  dev {
    restapi.baseurl = "https://dev-api.transunion.com"
  }
  qa {
    restapi.baseurl = "https://qa-api.transunion.com"
  }
  staging {
    restapi.baseurl = "https://staging-api.transunion.com"
  }
}
